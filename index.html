<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7955dc"><link rel="manifest" href="manifest.webmanifest"><title>Moje finance 💜</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;--bg:#f7f4ff;--card:#fff;--ink:#262139;--muted:#79728b;--accent:#7955dc;--border:#e9e3f4}body.dark{--bg:#161222;--card:#241d33;--ink:#f6f1ff;--muted:#b5a9c7;--border:#41364f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px;max-width:620px;margin:auto}.wrap{max-width:620px;margin:auto;padding:0 16px 100px}.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #24134408}.hero{background:linear-gradient(130deg,#8d6aea,#6546cc);color:white}.muted{color:var(--muted);font-size:13px}.hero .muted{color:#eee5ff}.big{font-size:36px;font-weight:800;margin:10px 0}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill,.btn{border:0;border-radius:14px;padding:12px 16px}.pill{background:var(--card);color:var(--ink);border:1px solid var(--border)}.btn{background:var(--accent);color:white;font-weight:700}.wide{width:100%}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.item:last-child{border:0}.emoji{font-size:24px;background:var(--bg);border-radius:14px;padding:10px}.grow{flex:1;min-width:0}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.amount{font-weight:750;white-space:nowrap}.field{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--ink);margin:5px 0 12px}label{font-size:13px;font-weight:650}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;padding:9px 8px max(12px,env(safe-area-inset-bottom));gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:12px}.nav button.active{background:var(--accent);color:white}.overlay{position:fixed;inset:0;background:#100b1d88;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:620px;max-height:90dvh;overflow:auto;background:var(--bg);padding:20px;border-radius:26px 26px 0 0}.hidden{display:none!important}.side{position:fixed;inset:0;background:#100b1d88;z-index:12}.drawer{background:var(--card);width:min(300px,85vw);height:100%;padding:25px}.drawer button{display:block;width:100%;text-align:left;margin:10px 0}.tiny{font-size:12px}.danger{color:#d94d6a}.progress{height:9px;background:var(--border);border-radius:20px;overflow:hidden}.progress div{height:100%;background:var(--accent)}h2{margin:14px 0}input[type=date]{min-height:45px}
</style></head><body><header><button class="pill" id="menu">☰</button><strong>💜 MOJE FINANCE</strong><button class="pill" id="theme">🌙</button></header><main class="wrap"><section id="home"><div class="flex"><h2>Moje peníze ✨</h2><input id="month" type="month" class="field" style="width:155px;margin:0"></div><div class="card hero"><div class="muted">Bilance za měsíc</div><div class="big" id="balance">0 Kč</div><div class="grid"><div><div class="muted">📥 Příjmy</div><h3 id="income">0 Kč</h3></div><div><div class="muted">📤 Výdaje</div><h3 id="expense">0 Kč</h3></div></div></div><div class="card"><div class="flex"><strong>🎯 Měsíční rozpočet</strong><button class="pill tiny" id="editLimit">Nastavit</button></div><div class="flex" style="margin:12px 0"><span id="spent"></span><span id="limitText"></span></div><div class="progress"><div id="bar" style="width:0"></div></div><p class="muted" id="remaining"></p></div><div class="flex"><h2>Poslední platby 🧾</h2><button class="pill tiny" data-page="history">Všechny</button></div><div class="card" id="recent"></div><button class="btn wide" id="quick">＋ Přidat výdaj</button></section><section id="history" class="hidden"><h2>Historie 🧾</h2><input class="field" id="search" placeholder="🔎 Hledat platbu..."><div class="card" id="all"></div></section><section id="stats" class="hidden"><h2>Statistiky 📊</h2><div class="card" id="statsContent"></div></section></main><nav class="nav"><button class="active" data-page="home">🏠 Přehled</button><button data-page="history">🧾 Historie</button><button id="navAdd" style="background:var(--accent);color:white">＋</button><button data-page="stats">📊 Statistiky</button></nav><div id="drawerCover" class="side hidden"><div class="drawer"><div class="flex"><h2>☰ Menu</h2><button class="pill" id="closeMenu">✕</button></div><button class="pill" id="drawerTheme">☀️ / 🌙 Motiv</button><button class="pill" id="drawerLimit">🎯 Nastavit rozpočet</button><button class="pill" id="export">📦 Export zálohy</button><button class="pill" id="importBtn">📥 Import zálohy</button><input type="file" accept=".json,application/json" id="importFile" hidden><p class="muted">Data zůstávají v tomto prohlížeči. Pravidelně si ukládej zálohu.</p></div></div><div id="modal" class="overlay hidden"><div class="sheet"><div class="flex"><h2 id="formTitle">Nový výdaj 💸</h2><button class="pill" id="closeModal">✕</button></div><form id="form"><label>Typ</label><select class="field" id="type"><option value="expense">📤 Výdaj</option><option value="income">📥 Příjem</option></select><label>Částka v Kč</label><input class="field" id="amount" inputmode="decimal" placeholder="Např. 250,50" required><label>Kategorie</label><select class="field" id="category"></select><label>Podkategorie</label><select class="field" id="subcategory"></select><label>Popis (nepovinné)</label><input class="field" id="note" placeholder="Např. Tesco"><label>Datum</label><input class="field" id="date" type="date" required><button class="btn wide" type="submit">💜 Uložit</button><button class="pill wide danger hidden" type="button" id="delete" style="margin-top:10px">🗑️ Smazat transakci</button></form></div></div><script>
const C={'🍔 Jídlo':['Potraviny','Restaurace','Rozvoz','Ostatní'],'⛽ Benzín':['Benzín','Nafta','AdBlue','Ostatní'],'🚬 Trafika':['Nikotinové sáčky','Tabák','Ostatní'],'📱 Tarif':['Mobilní tarif','Domácí internet'],'🎬 Předplatné':['Netflix','Spotify','Aplikace','Ostatní'],'🏡 Nájem':['Nájemné','Elektřina','Voda','Plyn','Ostatní'],'🚗 Doprava':['MHD','Parkování','Servis','Ostatní'],'🛍️ Nákupy':['Oblečení','Elektronika','Ostatní'],'💊 Zdraví':['Lékárna','Ostatní'],'🎉 Zábava':['Volný čas','Ostatní'],'📦 Ostatní':['Ostatní']};const I={'💰 Příjem':['Výplata','Brigáda','Dárek','Ostatní']};const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',maximumFractionDigits:2}).format(n);const today=()=>new Date().toLocaleDateString('sv-SE');let tx=[],limit=0,edit=null;try{tx=JSON.parse(localStorage.getItem('mf_transactions')||'[]');limit=Number(localStorage.getItem('mf_limit')||0)}catch(e){}function save(){localStorage.setItem('mf_transactions',JSON.stringify(tx));localStorage.setItem('mf_limit',String(limit));render()}function setTheme(d){document.body.classList.toggle('dark',d);localStorage.setItem('mf_theme',d?'dark':'light');$('theme').textContent=d?'☀️':'🌙'}setTheme(localStorage.getItem('mf_theme')==='dark');function cats(){let o=$('type').value==='income'?I:C;$('category').innerHTML=Object.keys(o).map(x=>'<option>'+x+'</option>').join('');subs()}function subs(){let o=$('type').value==='income'?I:C;$('subcategory').innerHTML=(o[$('category').value]||['Ostatní']).map(x=>'<option>'+x+'</option>').join('')}$('type').onchange=cats;$('category').onchange=subs;function openForm(id=null){edit=id;let t=tx.find(x=>x.id===id);$('formTitle').textContent=t?'Upravit transakci ✏️':'Nová transakce 💸';$('type').value=t?.type||'expense';cats();$('category').value=t?.category||Object.keys(C)[0];subs();$('subcategory').value=t?.subcategory||$('subcategory').options[0]?.value;$('amount').value=t?.amount??'';$('note').value=t?.note||'';$('date').value=t?.date||today();$('delete').classList.toggle('hidden',!t);$('modal').classList.remove('hidden');setTimeout(()=>$('amount').focus(),80)}function close(){ $('modal').classList.add('hidden')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function row(t){return '<div class="item"><div class="emoji">'+esc(t.category.split(' ')[0])+'</div><div class="grow"><div class="name">'+esc(t.note||t.subcategory||t.category)+'</div><div class="muted">'+esc(t.date)+' · '+esc(t.category)+'</div></div><div class="amount" style="color:'+(t.type==='income'?'#159a78':'var(--ink)')+'">'+(t.type==='income'?'+':'−')+fmt(t.amount)+'</div><button class="pill tiny" data-edit="'+esc(t.id)+'">✏️</button></div>'}function render(){let month=$('month').value;let m=tx.filter(t=>t.date.slice(0,7)===month);let inc=m.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);let out=m.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);$('balance').textContent=fmt(inc-out);$('income').textContent=fmt(inc);$('expense').textContent=fmt(out);$('spent').textContent=fmt(out);$('limitText').textContent=limit?fmt(limit):'Bez limitu';$('bar').style.width=limit?Math.min(100,out/limit*100)+'%':'0%';$('remaining').textContent=limit?'Zbývá '+fmt(limit-out):'Nastav si měsíční rozpočet';let sorted=[...tx].sort((a,b)=>b.date.localeCompare(a.date));$('recent').innerHTML=sorted.filter(t=>t.date.slice(0,7)===month).slice(0,5).map(row).join('')||'<p class="muted">Zatím žádné platby. Přidej první! 💜</p>';$('all').innerHTML=sorted.filter(t=>(t.note+' '+t.category+' '+t.subcategory).toLowerCase().includes($('search').value.toLowerCase())).map(row).join('')||'<p class="muted">Nic tu zatím není.</p>';let sums={};m.filter(t=>t.type==='expense').forEach(t=>sums[t.category]=(sums[t.category]||0)+t.amount);$('statsContent').innerHTML=Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div style="margin:15px 0"><div class="flex"><b>'+esc(k)+'</b><b>'+fmt(v)+'</b></div><div class="progress" style="margin-top:8px"><div style="width:'+(out?v/out*100:0)+'%"></div></div></div>').join('')||'<p class="muted">Statistiky se objeví po zadání výdajů.</p>'}function page(p){['home','history','stats'].forEach(x=>$(x).classList.toggle('hidden',x!==p));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}$('month').value=today().slice(0,7);$('month').onchange=render;$('search').oninput=render;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));$('quick').onclick=$('navAdd').onclick=()=>openForm();$('closeModal').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('form').onsubmit=e=>{e.preventDefault();let n=Number($('amount').value.replace(/\s/g,'').replace(',','.'));if(!Number.isFinite(n)||n<=0){alert('Zadej platnou kladnou částku.');return}let t={id:edit||String(Date.now())+Math.random(),type:$('type').value,amount:Math.round(n*100)/100,category:$('category').value,subcategory:$('subcategory').value,note:$('note').value.trim(),date:$('date').value};if(edit)tx=tx.map(x=>x.id===edit?t:x);else tx.push(t);save();close()};$('delete').onclick=()=>{if(edit&&confirm('Opravdu smazat tuto platbu?')){tx=tx.filter(t=>t.id!==edit);save();close()}};document.addEventListener('click',e=>{let b=e.target.closest('[data-edit]');if(b)openForm(b.dataset.edit)});function setLimit(){let v=prompt('Měsíční limit v Kč:',String(limit));if(v===null)return;let n=Number(v.replace(',','.'));if(Number.isFinite(n)&&n>=0){limit=n;save()}else alert('Neplatná částka')}$('editLimit').onclick=setLimit;$('drawerLimit').onclick=()=>{hideMenu();setLimit()};function hideMenu(){$('drawerCover').classList.add('hidden')}$('menu').onclick=()=>$('drawerCover').classList.remove('hidden');$('closeMenu').onclick=hideMenu;$('drawerCover').onclick=e=>{if(e.target===$('drawerCover'))hideMenu()};$('theme').onclick=$('drawerTheme').onclick=()=>setTheme(!document.body.classList.contains('dark'));$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,transactions:tx,limit},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moje-finance-zaloha.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.transactions))throw Error();if(!confirm('Import nahradí současné transakce. Pokračovat?'))return;tx=data.transactions.filter(t=>t&&typeof t.amount==='number'&&typeof t.date==='string');limit=Number(data.limit)||0;save();hideMenu();alert('Záloha obnovena')}catch(e){alert('Soubor není platná záloha.')}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
